<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dreamer N?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      background-color: #050505;
      background-image: url("bg.jpg");
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      padding: 56px 20px 64px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 22px;
      display: block;
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.2px;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .subtitle {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 34px;
      letter-spacing: 0.3px;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 62px;
      padding: 16px 24px;
      border-radius: 2px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: 0.2px;
      transition: transform 0.12s ease, filter 0.15s ease;
    }

    .link-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .link-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <img id="avatar" class="avatar" src="avatar.jpg" alt="Dreamer N?" />
    <h1 id="title"></h1>
    <p id="subtitle" class="subtitle"></p>
    <div id="links" class="links"></div>
  </div>

  <script>
    // ================= НАСТРОЙКИ СТРАНИЦЫ =================
    const PAGE = {
      title: "Dreamer N?",
      subtitle: "☽ ALL ☬",
      avatar: "avatar.jpg",
      links: [
        {
          text: "☽ NEW RELEASE - The present slips away, yet the future never arrives ☬",
          url: "#",
          bg: "#FFFFFF",
          color: "#000000"
        },
        {
          text: "☽ Subproject. Sky & clouds ☬",
          url: "#",
          bg: "#595959",
          color: "#FFFFFF"
        },
        {
          text: "☽ Subproject. Cherry Music Covers ☬",
          url: "#",
          bg: "#595959",
          color: "#FFFFFF"
        },
        {
          text: "Instagram",
          url: "https://instagram.com/",
          bg: "#EC00BC",
          color: "#FFFFFF"
        },
        {
          text: "Spotify",
          url: "https://open.spotify.com/",
          bg: "#1ED760",
          color: "#FFFFFF"
        }
      ]
    };
    // ======================================================

    document.title = PAGE.title;
    document.getElementById("title").textContent = PAGE.title;
    document.getElementById("subtitle").textContent = PAGE.subtitle;

    const avatarEl = document.getElementById("avatar");
    avatarEl.src = PAGE.avatar;
    avatarEl.onerror = () => { avatarEl.style.display = "none"; };

    const linksContainer = document.getElementById("links");
    PAGE.links.forEach(item => {
      const a = document.createElement("a");
      a.className = "link-btn";
      a.href = item.url || "#";
      if (item.url && item.url !== "#") {
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      }
      a.textContent = item.text;
      a.style.backgroundColor = item.bg || "#595959";
      a.style.color = item.color || "#FFFFFF";
      linksContainer.appendChild(a);
    });
  </script>
</body>
</html>
